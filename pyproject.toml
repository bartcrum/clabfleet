[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clabfleet"
version = "0.2.0"
description = "Automate containerlab lab deployment across one or many hosts"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "paramiko>=3.4",
]

[project.optional-dependencies]
napalm = ["napalm>=4.0"]
gui = ["aiohttp>=3.13.3", "ruamel.yaml>=0.17.21", "PyJWT[crypto]>=2.8"]
ldap = ["ldap3>=2.9"]
dev = ["pytest>=7.0", "aiohttp>=3.13.3", "ruamel.yaml>=0.17.21", "PyJWT[crypto]>=2.8", "ldap3>=2.9"]

[project.scripts]
clabfleet = "clabfleet.cli:main"

[tool.setuptools.packages.find]
include = ["clabfleet*"]

[tool.setuptools.package-data]
"clabfleet.gui" = ["static/*", "static/vendor/*"]
