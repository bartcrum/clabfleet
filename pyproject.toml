[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "eve-ng-automator"
version = "0.1.0"
description = "Automate EVE-NG lab topology deployment and teardown"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "pyyaml>=6.0",
    "urllib3>=1.26",
    "paramiko>=3.0",
]

[project.optional-dependencies]
napalm = ["napalm>=4.0"]
dev = ["pytest>=7.0", "pytest-mock", "responses>=0.23"]

[project.scripts]
eve-ng-automator = "eve_ng_automator.cli:main"

[tool.setuptools.packages.find]
include = ["eve_ng_automator*"]
