[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clab-automator"
version = "0.2.0"
description = "Automate containerlab lab deployment across one or many hosts"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "paramiko>=3.0",
]

[project.optional-dependencies]
napalm = ["napalm>=4.0"]
dev = ["pytest>=7.0"]

[project.scripts]
clab-automator = "clab_automator.cli:main"

[tool.setuptools.packages.find]
include = ["clab_automator*"]
