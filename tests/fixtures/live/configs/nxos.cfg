!Command: show running-config
version 10.3(2) Bios:version
hostname nx-leaf-01
feature tacacs+
feature ospf
feature bgp

username admin password 5 $5$NXADMIN0201$abcdefg  role network-admin
username ops password 5 $5$NXOPS0202$hijklmn  role network-operator
tacacs-server key 7 "NXTACACS0203"
tacacs-server host 198.51.100.20 key 7 "NXTACACS0204"
aaa group server tacacs+ TAC
    server 198.51.100.20
    use-vrf management
snmp-server user admin network-admin auth md5 0xNXSNMP0205 priv 0xNXSNMP0206 localizedkey
snmp-server community NXCOMM0207 group network-operator

vrf context management
  ip route 0.0.0.0/0 192.0.2.1

interface Ethernet1/1
  description to spine
  no switchport
  ip address 10.1.1.1/31
  ip ospf authentication-key 3 NXOSPF0208

interface mgmt0
  vrf member management
  ip address 192.0.2.31/24

router bgp 65010
  neighbor 10.1.1.0
    remote-as 65000
    password 3 NXBGP0209
