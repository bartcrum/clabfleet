name: release

# Pushing a tag v<version> builds the package, publishes it to PyPI and
# makes the GitHub release. See docs/releasing.md.
#
# Three jobs, so that each holds only what it needs: the build (which runs
# the build tools and setuptools) cannot publish, the publish job runs no
# build code, and only the last job can write to the repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: The tag is the package's version, and the changelog has it
        run: |
          version=$(python -c "import clabfleet; print(clabfleet.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but clabfleet/__init__.py says $version"
            exit 1
          fi
          awk -v v="$version" '$0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section '## $version'"
            exit 1
          fi
          if grep -q '^Not released yet' notes.md; then
            echo "::error::CHANGELOG.md still says $version is not released"
            exit 1
          fi
      - name: Build
        run: |
          pip install -r .github/requirements-release.txt
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  publish:
    name: Publish ${{ github.ref_name }} to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing: no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release ${{ github.ref_name }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: notes
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME" --notes-file notes.md
