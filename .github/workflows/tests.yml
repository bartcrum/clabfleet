name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[gui,dev]"
      - name: Test
        # The GUI's browser smoke test must run here (the runners have Chrome)
        env:
          CLABFLEET_REQUIRE_BROWSER: "1"
          CLABFLEET_BROWSER: google-chrome
        run: pytest -v
