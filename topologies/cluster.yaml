# Cluster inventory — your pool of containerlab hosts.
#
# Each host needs Docker and containerlab installed, plus SSH access for the
# user below (key-based auth recommended). The automator spreads nodes
# across the hosts based on available resources and placement strategy;
# links between hosts become VXLAN links that containerlab sets up itself.
#
# Usage:
#   clab-automator status --cluster topologies/cluster.yaml
#   clab-automator deploy topologies/large_campus.clab.yml \
#       --cluster topologies/cluster.yaml --strategy bin-pack -v

cluster:
  link_type: "vxlan-stitch"       # vxlan-stitch | vxlan
  vni_base: 1000                  # each cross-host link gets the next VNI
  dst_port: 14789                 # VXLAN UDP port — must be open between hosts
  mtu: 1450                       # leave room for the 50-byte VXLAN overhead

hosts:
  - name: "clab-1"
    host: "192.168.1.101"         # SSH address; also the VXLAN endpoint
    ssh_user: "netops"
    ssh_key: "~/.ssh/id_ed25519"
    sudo: true                    # needs passwordless sudo (or clab_admins group + sudo: false)
    max_cpu: 16                   # vCPUs available for lab nodes (default: nproc)
    max_ram: 65536                # MB available for lab nodes (default: MemAvailable)
    tags: ["core", "spine"]       # for affinity-based placement

  - name: "clab-2"
    host: "192.168.1.102"
    ssh_user: "netops"
    ssh_key: "~/.ssh/id_ed25519"
    sudo: true
    max_cpu: 16
    max_ram: 65536
    tags: ["distribution", "leaf"]

  - name: "clab-3"
    host: "192.168.1.103"
    vtep_ip: "10.10.10.3"         # use a dedicated underlay address for VXLAN
    ssh_user: "netops"
    ssh_key: "~/.ssh/id_ed25519"
    sudo: true
    max_cpu: 8
    max_ram: 32768
    tags: ["access", "leaf"]
