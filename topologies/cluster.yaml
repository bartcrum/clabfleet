# Cluster inventory — defines your pool of EVE-NG servers.
#
# The automator will spread nodes across these hosts based on available
# resources and placement strategy. Cross-host links are stitched with
# GRE or VXLAN tunnels automatically.
#
# Usage:
#   eve-ng-automator deploy topologies/large_campus.yaml \
#       --cluster topologies/cluster.yaml --strategy bin-pack --start
#
#   eve-ng-automator cluster-status topologies/cluster.yaml

cluster:
  tunnel_mode: "gre"              # gre | vxlan
  tunnel_pnet: "pnet9"            # cloud interface used for inter-host tunnels
  tunnel_subnet: "172.16.255.0/24"

hosts:
  - name: "eve-1"
    host: "192.168.1.101"
    username: "admin"
    password: "eve"
    port: 443
    ssl: true
    max_cpu: 16                   # vCPUs available for lab nodes
    max_ram: 65536                # MB available for lab nodes
    tags: ["core", "spine"]       # for affinity-based placement

  - name: "eve-2"
    host: "192.168.1.102"
    username: "admin"
    password: "eve"
    port: 443
    ssl: true
    max_cpu: 16
    max_ram: 65536
    tags: ["distribution", "leaf"]

  - name: "eve-3"
    host: "192.168.1.103"
    username: "admin"
    password: "eve"
    port: 443
    ssl: true
    max_cpu: 8
    max_ram: 32768
    tags: ["access", "leaf"]
