# Spine-Leaf data center fabric
# 2 spines + 4 leaves using Arista cEOS.
#
# cEOS images are not public: download cEOS-lab from arista.com and import it:
#   docker import cEOS64-lab-4.32.0F.tar.xz ceos:4.32.0F
#
# Deploy:
#   clab-automator deploy topologies/spine_leaf.clab.yml

name: spine-leaf-fabric

topology:
  kinds:
    arista_ceos:
      image: ceos:4.32.0F

  nodes:
    # -- Spines --
    Spine-1:
      kind: arista_ceos
      startup-config: |
        hostname Spine-1
        !
        ip routing
        !
        interface Loopback0
         ip address 10.255.0.1/32
        !
        interface Ethernet1
         description to-Leaf-1
         no switchport
         ip address 10.0.1.0/31
        !
        interface Ethernet2
         description to-Leaf-2
         no switchport
         ip address 10.0.1.2/31
        !
        interface Ethernet3
         description to-Leaf-3
         no switchport
         ip address 10.0.1.4/31
        !
        interface Ethernet4
         description to-Leaf-4
         no switchport
         ip address 10.0.1.6/31
        !
        router bgp 65000
         router-id 10.255.0.1
         neighbor LEAVES peer group
         neighbor LEAVES remote-as 65001
         neighbor 10.0.1.1 peer group LEAVES
         neighbor 10.0.1.3 peer group LEAVES
         neighbor 10.0.1.5 peer group LEAVES
         neighbor 10.0.1.7 peer group LEAVES

    Spine-2:
      kind: arista_ceos
      startup-config: |
        hostname Spine-2
        !
        ip routing
        !
        interface Loopback0
         ip address 10.255.0.2/32
        !
        interface Ethernet1
         description to-Leaf-1
         no switchport
         ip address 10.0.2.0/31
        !
        interface Ethernet2
         description to-Leaf-2
         no switchport
         ip address 10.0.2.2/31
        !
        interface Ethernet3
         description to-Leaf-3
         no switchport
         ip address 10.0.2.4/31
        !
        interface Ethernet4
         description to-Leaf-4
         no switchport
         ip address 10.0.2.6/31
        !
        router bgp 65000
         router-id 10.255.0.2
         neighbor LEAVES peer group
         neighbor LEAVES remote-as 65001
         neighbor 10.0.2.1 peer group LEAVES
         neighbor 10.0.2.3 peer group LEAVES
         neighbor 10.0.2.5 peer group LEAVES
         neighbor 10.0.2.7 peer group LEAVES

    # -- Leaves --
    Leaf-1:
      kind: arista_ceos
      startup-config: |
        hostname Leaf-1
        !
        ip routing
        !
        interface Loopback0
         ip address 10.255.1.1/32
        !
        interface Ethernet1
         description to-Spine-1
         no switchport
         ip address 10.0.1.1/31
        !
        interface Ethernet2
         description to-Spine-2
         no switchport
         ip address 10.0.2.1/31

    Leaf-2:
      kind: arista_ceos
      startup-config: |
        hostname Leaf-2
        !
        ip routing
        !
        interface Loopback0
         ip address 10.255.1.2/32
        !
        interface Ethernet1
         description to-Spine-1
         no switchport
         ip address 10.0.1.3/31
        !
        interface Ethernet2
         description to-Spine-2
         no switchport
         ip address 10.0.2.3/31

    Leaf-3:
      kind: arista_ceos
      startup-config: |
        hostname Leaf-3
        !
        ip routing
        !
        interface Loopback0
         ip address 10.255.1.3/32
        !
        interface Ethernet1
         description to-Spine-1
         no switchport
         ip address 10.0.1.5/31
        !
        interface Ethernet2
         description to-Spine-2
         no switchport
         ip address 10.0.2.5/31

    Leaf-4:
      kind: arista_ceos
      startup-config: |
        hostname Leaf-4
        !
        ip routing
        !
        interface Loopback0
         ip address 10.255.1.4/32
        !
        interface Ethernet1
         description to-Spine-1
         no switchport
         ip address 10.0.1.7/31
        !
        interface Ethernet2
         description to-Spine-2
         no switchport
         ip address 10.0.2.7/31

  # Spine-to-leaf links
  links:
    - endpoints: ["Spine-1:Ethernet1", "Leaf-1:Ethernet1"]
    - endpoints: ["Spine-1:Ethernet2", "Leaf-2:Ethernet1"]
    - endpoints: ["Spine-1:Ethernet3", "Leaf-3:Ethernet1"]
    - endpoints: ["Spine-1:Ethernet4", "Leaf-4:Ethernet1"]
    - endpoints: ["Spine-2:Ethernet1", "Leaf-1:Ethernet2"]
    - endpoints: ["Spine-2:Ethernet2", "Leaf-2:Ethernet2"]
    - endpoints: ["Spine-2:Ethernet3", "Leaf-3:Ethernet2"]
    - endpoints: ["Spine-2:Ethernet4", "Leaf-4:Ethernet2"]
