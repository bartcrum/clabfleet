# Spine-Leaf data center fabric
# 2 spines + 4 leaves using Arista vEOS or Cisco NX-OSv9k.

lab:
  name: "spine-leaf-fabric"
  description: "2-spine 4-leaf EVPN-VXLAN fabric"
  author: "netops"
  path: "/"

nodes:
  # -- Spines --
  - name: "Spine-1"
    template: "veos"
    image: "veos-4.28.0F"
    ethernet: 8
    ram: 4096
    cpu: 2
    console: "telnet"
    left: 300
    top: 100
    startup_config: |
      hostname Spine-1
      !
      interface Loopback0
       ip address 10.255.0.1/32
      !
      interface Ethernet1
       description to-Leaf-1
       no switchport
       ip address 10.0.1.0/31
      !
      interface Ethernet2
       description to-Leaf-2
       no switchport
       ip address 10.0.1.2/31
      !
      interface Ethernet3
       description to-Leaf-3
       no switchport
       ip address 10.0.1.4/31
      !
      interface Ethernet4
       description to-Leaf-4
       no switchport
       ip address 10.0.1.6/31
      !
      router bgp 65000
       router-id 10.255.0.1
       neighbor LEAVES peer group
       neighbor LEAVES remote-as 65001
       neighbor 10.0.1.1 peer group LEAVES
       neighbor 10.0.1.3 peer group LEAVES
       neighbor 10.0.1.5 peer group LEAVES
       neighbor 10.0.1.7 peer group LEAVES

  - name: "Spine-2"
    template: "veos"
    image: "veos-4.28.0F"
    ethernet: 8
    ram: 4096
    cpu: 2
    console: "telnet"
    left: 600
    top: 100
    startup_config: |
      hostname Spine-2
      !
      interface Loopback0
       ip address 10.255.0.2/32
      !
      interface Ethernet1
       description to-Leaf-1
       no switchport
       ip address 10.0.2.0/31
      !
      interface Ethernet2
       description to-Leaf-2
       no switchport
       ip address 10.0.2.2/31
      !
      interface Ethernet3
       description to-Leaf-3
       no switchport
       ip address 10.0.2.4/31
      !
      interface Ethernet4
       description to-Leaf-4
       no switchport
       ip address 10.0.2.6/31
      !
      router bgp 65000
       router-id 10.255.0.2
       neighbor LEAVES peer group
       neighbor LEAVES remote-as 65001
       neighbor 10.0.2.1 peer group LEAVES
       neighbor 10.0.2.3 peer group LEAVES
       neighbor 10.0.2.5 peer group LEAVES
       neighbor 10.0.2.7 peer group LEAVES

  # -- Leaves --
  - name: "Leaf-1"
    template: "veos"
    image: "veos-4.28.0F"
    ethernet: 8
    ram: 4096
    cpu: 2
    console: "telnet"
    left: 100
    top: 350
    startup_config: |
      hostname Leaf-1
      !
      interface Loopback0
       ip address 10.255.1.1/32
      !
      interface Ethernet1
       description to-Spine-1
       no switchport
       ip address 10.0.1.1/31
      !
      interface Ethernet2
       description to-Spine-2
       no switchport
       ip address 10.0.2.1/31

  - name: "Leaf-2"
    template: "veos"
    image: "veos-4.28.0F"
    ethernet: 8
    ram: 4096
    cpu: 2
    console: "telnet"
    left: 350
    top: 350
    startup_config: |
      hostname Leaf-2
      !
      interface Loopback0
       ip address 10.255.1.2/32
      !
      interface Ethernet1
       description to-Spine-1
       no switchport
       ip address 10.0.1.3/31
      !
      interface Ethernet2
       description to-Spine-2
       no switchport
       ip address 10.0.2.3/31

  - name: "Leaf-3"
    template: "veos"
    image: "veos-4.28.0F"
    ethernet: 8
    ram: 4096
    cpu: 2
    console: "telnet"
    left: 600
    top: 350
    startup_config: |
      hostname Leaf-3
      !
      interface Loopback0
       ip address 10.255.1.3/32
      !
      interface Ethernet1
       description to-Spine-1
       no switchport
       ip address 10.0.1.5/31
      !
      interface Ethernet2
       description to-Spine-2
       no switchport
       ip address 10.0.2.5/31

  - name: "Leaf-4"
    template: "veos"
    image: "veos-4.28.0F"
    ethernet: 8
    ram: 4096
    cpu: 2
    console: "telnet"
    left: 850
    top: 350
    startup_config: |
      hostname Leaf-4
      !
      interface Loopback0
       ip address 10.255.1.4/32
      !
      interface Ethernet1
       description to-Spine-1
       no switchport
       ip address 10.0.1.7/31
      !
      interface Ethernet2
       description to-Spine-2
       no switchport
       ip address 10.0.2.7/31

# Spine-to-leaf links
links:
  # Spine-1 downlinks
  - endpoints:
      - node: "Spine-1"
        interface: 0
      - node: "Leaf-1"
        interface: 0
  - endpoints:
      - node: "Spine-1"
        interface: 1
      - node: "Leaf-2"
        interface: 0
  - endpoints:
      - node: "Spine-1"
        interface: 2
      - node: "Leaf-3"
        interface: 0
  - endpoints:
      - node: "Spine-1"
        interface: 3
      - node: "Leaf-4"
        interface: 0

  # Spine-2 downlinks
  - endpoints:
      - node: "Spine-2"
        interface: 0
      - node: "Leaf-1"
        interface: 1
  - endpoints:
      - node: "Spine-2"
        interface: 1
      - node: "Leaf-2"
        interface: 1
  - endpoints:
      - node: "Spine-2"
        interface: 2
      - node: "Leaf-3"
        interface: 1
  - endpoints:
      - node: "Spine-2"
        interface: 3
      - node: "Leaf-4"
        interface: 1
