# Three-router triangle topology
# Deploys 3 Cisco IOSv routers in a full-mesh triangle with OSPF.

lab:
  name: "three-router-triangle"
  description: "3x IOSv routers in a full-mesh triangle for OSPF testing"
  author: "netops"
  path: "/"

nodes:
  - name: "R1"
    template: "vios"
    image: "vios-adventerprisek9-m.vmdk.SPA-15.9.3M6"
    ethernet: 4
    ram: 512
    cpu: 1
    console: "telnet"
    left: 400
    top: 100
    startup_config: |
      hostname R1
      !
      interface Loopback0
       ip address 1.1.1.1 255.255.255.255
      !
      interface GigabitEthernet0/0
       description to-R2
       ip address 10.0.12.1 255.255.255.0
       no shutdown
      !
      interface GigabitEthernet0/1
       description to-R3
       ip address 10.0.13.1 255.255.255.0
       no shutdown
      !
      router ospf 1
       network 0.0.0.0 255.255.255.255 area 0
      !
      end

  - name: "R2"
    template: "vios"
    image: "vios-adventerprisek9-m.vmdk.SPA-15.9.3M6"
    ethernet: 4
    ram: 512
    cpu: 1
    console: "telnet"
    left: 200
    top: 350
    startup_config: |
      hostname R2
      !
      interface Loopback0
       ip address 2.2.2.2 255.255.255.255
      !
      interface GigabitEthernet0/0
       description to-R1
       ip address 10.0.12.2 255.255.255.0
       no shutdown
      !
      interface GigabitEthernet0/1
       description to-R3
       ip address 10.0.23.2 255.255.255.0
       no shutdown
      !
      router ospf 1
       network 0.0.0.0 255.255.255.255 area 0
      !
      end

  - name: "R3"
    template: "vios"
    image: "vios-adventerprisek9-m.vmdk.SPA-15.9.3M6"
    ethernet: 4
    ram: 512
    cpu: 1
    console: "telnet"
    left: 600
    top: 350
    startup_config: |
      hostname R3
      !
      interface Loopback0
       ip address 3.3.3.3 255.255.255.255
      !
      interface GigabitEthernet0/0
       description to-R1
       ip address 10.0.13.3 255.255.255.0
       no shutdown
      !
      interface GigabitEthernet0/1
       description to-R2
       ip address 10.0.23.3 255.255.255.0
       no shutdown
      !
      router ospf 1
       network 0.0.0.0 255.255.255.255 area 0
      !
      end

# Point-to-point links use auto-created bridge networks
links:
  - endpoints:
      - node: "R1"
        interface: "Gi0/0"
      - node: "R2"
        interface: "Gi0/0"
  - endpoints:
      - node: "R1"
        interface: "Gi0/1"
      - node: "R3"
        interface: "Gi0/0"
  - endpoints:
      - node: "R2"
        interface: "Gi0/1"
      - node: "R3"
        interface: "Gi0/1"
