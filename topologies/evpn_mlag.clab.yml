           neighbor EVPN send-community extended
           neighbor 10.255.0.1 peer group EVPN
           neighbor 10.255.0.2 peer group EVPN
           !
           vlan 10
              rd 10.255.1.4:10010
              route-target both 10:10010
              redistribute learned
           !
           vlan 20
              rd 10.255.1.4:10020
              route-target both 20:10020
              redistribute learned
           !
           address-family evpn
              neighbor EVPN activate
           !
           address-family ipv4
              no neighbor EVPN activate
           !
           vrf TENANT
              rd 10.255.1.4:50001
              route-target import evpn 50001:50001
              route-target export evpn 50001:50001
              redistribute connected

    # -- Hosts: eth1 and eth2 bonded with LACP, one link to each leaf of the pair --
    Host-1:
      kind: linux
      exec:
        - ip link add bond0 type bond mode 802.3ad lacp_rate fast miimon 100
        - ip link set eth1 down
        - ip link set eth1 master bond0
        - ip link set eth2 down
        - ip link set eth2 master bond0
        - ip link set bond0 up
        - ip addr add 10.10.10.11/24 dev bond0
        - ip route replace default via 10.10.10.1

    Host-2:
      kind: linux
      exec:
        - ip link add bond0 type bond mode 802.3ad lacp_rate fast miimon 100
        - ip link set eth1 down
        - ip link set eth1 master bond0
        - ip link set eth2 down
        - ip link set eth2 master bond0
        - ip link set bond0 up
        - ip addr add 10.20.20.12/24 dev bond0
        - ip route replace default via 10.20.20.1

    Host-3:
      kind: linux
      exec:
        - ip link add bond0 type bond mode 802.3ad lacp_rate fast miimon 100
        - ip link set eth1 down
        - ip link set eth1 master bond0
        - ip link set eth2 down
        - ip link set eth2 master bond0
        - ip link set bond0 up
        - ip addr add 10.10.10.13/24 dev bond0
        - ip route replace default via 10.10.10.1

    Host-4:
      kind: linux
      exec:
        - ip link add bond0 type bond mode 802.3ad lacp_rate fast miimon 100
        - ip link set eth1 down
        - ip link set eth1 master bond0
        - ip link set eth2 down
        - ip link set eth2 master bond0
        - ip link set bond0 up
        - ip addr add 10.20.20.14/24 dev bond0
        - ip route replace default via 10.20.20.1

  links:
    # Spine-to-leaf
    - endpoints: ["Spine-1:eth1", "Leaf-1:eth1"]
    - endpoints: ["Spine-1:eth2", "Leaf-2:eth1"]
    - endpoints: ["Spine-1:eth3", "Leaf-3:eth1"]
    - endpoints: ["Spine-1:eth4", "Leaf-4:eth1"]
    - endpoints: ["Spine-2:eth1", "Leaf-1:eth2"]
    - endpoints: ["Spine-2:eth2", "Leaf-2:eth2"]
    - endpoints: ["Spine-2:eth3", "Leaf-3:eth2"]
    - endpoints: ["Spine-2:eth4", "Leaf-4:eth2"]
    # MLAG peer-links (Port-Channel10)
    - endpoints: ["Leaf-1:eth3", "Leaf-2:eth3"]
    - endpoints: ["Leaf-1:eth4", "Leaf-2:eth4"]
    - endpoints: ["Leaf-3:eth3", "Leaf-4:eth3"]
    - endpoints: ["Leaf-3:eth4", "Leaf-4:eth4"]
    # Hosts, dual-homed to a pair
    - endpoints: ["Leaf-1:eth5", "Host-1:eth1"]
    - endpoints: ["Leaf-2:eth5", "Host-1:eth2"]
    - endpoints: ["Leaf-1:eth6", "Host-2:eth1"]
    - endpoints: ["Leaf-2:eth6", "Host-2:eth2"]
    - endpoints: ["Leaf-3:eth5", "Host-3:eth1"]
    - endpoints: ["Leaf-4:eth5", "Host-3:eth2"]
    - endpoints: ["Leaf-3:eth6", "Host-4:eth1"]
    - endpoints: ["Leaf-4:eth6", "Host-4:eth2"]
