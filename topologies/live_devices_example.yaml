# Example device inventory for export-live command.
# Lists production devices to connect to via NAPALM,
# pull running configs and LLDP neighbours, and generate
# a containerlab topology that mirrors the live network. Running configs
# are written to configs/<node>.cfg next to the output file.
#
# kind/image/type are optional: kind defaults from the NAPALM platform
# (ios → cisco_iol, eos → arista_ceos, junos → juniper_vjunosrouter, ...).
#
# Usage:
#   clab-automator export-live topologies/live_devices_example.yaml \
#       -o imported/prod_mirror.clab.yml --lab-name "prod-mirror"

devices:
  - hostname: "core-rtr-01.example.com"
    platform: "ios"           # NAPALM driver
    username: "admin"
    password: "changeme"      # or use env vars / vault
    kind: "cisco_iol"         # containerlab kind
    image: "vrnetlab/cisco_iol:17.12.01"

  - hostname: "core-rtr-02.example.com"
    platform: "ios"
    username: "admin"
    password: "changeme"
    kind: "cisco_iol"
    image: "vrnetlab/cisco_iol:17.12.01"

  - hostname: "dist-sw-01.example.com"
    platform: "eos"
    username: "admin"
    password: "changeme"
    kind: "arista_ceos"
    image: "ceos:4.32.0F"
    optional_args:
      transport: "https"

  - hostname: "dist-sw-02.example.com"
    platform: "eos"
    username: "admin"
    password: "changeme"
    kind: "arista_ceos"
    image: "ceos:4.32.0F"
    optional_args:
      transport: "https"

  - hostname: "fw-01.example.com"
    platform: "panos"
    username: "admin"
    password: "changeme"
    kind: "paloalto_panos"
    image: "vrnetlab/paloalto_pan:11.1.0"
