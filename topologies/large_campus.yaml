# Large campus network — designed for multi-host deployment.
#
# This topology has enough nodes to benefit from spreading across
# 2-3 EVE-NG servers. Nodes can be explicitly pinned to a host or
# placed automatically by the placement engine.
#
# Deploy:
#   eve-ng-automator deploy topologies/large_campus.yaml \
#       --cluster topologies/cluster.yaml --strategy bin-pack --start -vv
#
# Teardown:
#   eve-ng-automator teardown topologies/large_campus.yaml \
#       --cluster topologies/cluster.yaml

lab:
  name: "campus-network"
  description: "Multi-host campus network with core, distribution, and access layers"
  author: "netops"
  path: "/"

nodes:
  # === CORE LAYER (pinned to eve-1 — high-performance host) ===
  - name: "Core-1"
    template: "csr1000v"
    image: "csr1000vng-universalk9.17.03.06-serial"
    ethernet: 8
    ram: 4096
    cpu: 2
    host: "eve-1"                # explicit host pinning
    left: 350
    top: 50
    startup_config: |
      hostname Core-1
      !
      interface Loopback0
       ip address 10.255.0.1 255.255.255.255
      !
      interface GigabitEthernet1
       description to-Core-2
       ip address 10.0.0.0 255.255.255.254
       no shutdown
      !
      interface GigabitEthernet2
       description to-Dist-1
       ip address 10.0.1.0 255.255.255.254
       no shutdown
      !
      interface GigabitEthernet3
       description to-Dist-2
       ip address 10.0.1.2 255.255.255.254
       no shutdown
      !
      router ospf 1
       router-id 10.255.0.1
       network 10.0.0.0 0.0.255.255 area 0

  - name: "Core-2"
    template: "csr1000v"
    image: "csr1000vng-universalk9.17.03.06-serial"
    ethernet: 8
    ram: 4096
    cpu: 2
    host: "eve-1"
    left: 550
    top: 50
    startup_config: |
      hostname Core-2
      !
      interface Loopback0
       ip address 10.255.0.2 255.255.255.255
      !
      interface GigabitEthernet1
       description to-Core-1
       ip address 10.0.0.1 255.255.255.254
       no shutdown
      !
      interface GigabitEthernet2
       description to-Dist-1
       ip address 10.0.1.4 255.255.255.254
       no shutdown
      !
      interface GigabitEthernet3
       description to-Dist-2
       ip address 10.0.1.6 255.255.255.254
       no shutdown
      !
      router ospf 1
       router-id 10.255.0.2
       network 10.0.0.0 0.0.255.255 area 0

  # === DISTRIBUTION LAYER (use tag affinity) ===
  - name: "Dist-1"
    template: "vios"
    image: "vios-adventerprisek9-m.vmdk.SPA-15.9.3M6"
    ethernet: 8
    ram: 1024
    cpu: 1
    host_tags: ["distribution"]   # prefer hosts tagged "distribution"
    left: 250
    top: 200
    startup_config: |
      hostname Dist-1
      !
      interface Loopback0
       ip address 10.255.1.1 255.255.255.255
      !
      interface GigabitEthernet0/0
       description to-Core-1
       ip address 10.0.1.1 255.255.255.254
       no shutdown
      !
      interface GigabitEthernet0/1
       description to-Core-2
       ip address 10.0.1.5 255.255.255.254
       no shutdown
      !
      interface GigabitEthernet0/2
       description to-Access-1
       ip address 10.0.2.0 255.255.255.254
       no shutdown
      !
      interface GigabitEthernet0/3
       description to-Access-2
       ip address 10.0.2.2 255.255.255.254
       no shutdown
      !
      router ospf 1
       router-id 10.255.1.1
       network 10.0.0.0 0.0.255.255 area 0

  - name: "Dist-2"
    template: "vios"
    image: "vios-adventerprisek9-m.vmdk.SPA-15.9.3M6"
    ethernet: 8
    ram: 1024
    cpu: 1
    host_tags: ["distribution"]
    left: 650
    top: 200
    startup_config: |
      hostname Dist-2
      !
      interface Loopback0
       ip address 10.255.1.2 255.255.255.255
      !
      interface GigabitEthernet0/0
       description to-Core-1
       ip address 10.0.1.3 255.255.255.254
       no shutdown
      !
      interface GigabitEthernet0/1
       description to-Core-2
       ip address 10.0.1.7 255.255.255.254
       no shutdown
      !
      interface GigabitEthernet0/2
       description to-Access-3
       ip address 10.0.2.4 255.255.255.254
       no shutdown
      !
      interface GigabitEthernet0/3
       description to-Access-4
       ip address 10.0.2.6 255.255.255.254
       no shutdown
      !
      router ospf 1
       router-id 10.255.1.2
       network 10.0.0.0 0.0.255.255 area 0

  # === ACCESS LAYER (auto-placed — will spread across remaining capacity) ===
  - name: "Access-1"
    template: "iosvl2"
    image: "viosl2-adventerprisek9-m.ssa.high_iron_20200929"
    ethernet: 8
    ram: 768
    cpu: 1
    host_tags: ["access"]
    left: 100
    top: 400
    startup_config: |
      hostname Access-1
      !
      interface GigabitEthernet0/0
       description to-Dist-1
       no switchport
       ip address 10.0.2.1 255.255.255.254
       no shutdown
      !
      vlan 10
       name Users
      vlan 20
       name VoIP

  - name: "Access-2"
    template: "iosvl2"
    image: "viosl2-adventerprisek9-m.ssa.high_iron_20200929"
    ethernet: 8
    ram: 768
    cpu: 1
    host_tags: ["access"]
    left: 300
    top: 400
    startup_config: |
      hostname Access-2
      !
      interface GigabitEthernet0/0
       description to-Dist-1
       no switchport
       ip address 10.0.2.3 255.255.255.254
       no shutdown
      !
      vlan 10
       name Users
      vlan 20
       name VoIP

  - name: "Access-3"
    template: "iosvl2"
    image: "viosl2-adventerprisek9-m.ssa.high_iron_20200929"
    ethernet: 8
    ram: 768
    cpu: 1
    host_tags: ["access"]
    left: 600
    top: 400
    startup_config: |
      hostname Access-3
      !
      interface GigabitEthernet0/0
       description to-Dist-2
       no switchport
       ip address 10.0.2.5 255.255.255.254
       no shutdown
      !
      vlan 10
       name Users
      vlan 20
       name VoIP

  - name: "Access-4"
    template: "iosvl2"
    image: "viosl2-adventerprisek9-m.ssa.high_iron_20200929"
    ethernet: 8
    ram: 768
    cpu: 1
    host_tags: ["access"]
    left: 800
    top: 400
    startup_config: |
      hostname Access-4
      !
      interface GigabitEthernet0/0
       description to-Dist-2
       no switchport
       ip address 10.0.2.7 255.255.255.254
       no shutdown
      !
      vlan 10
       name Users
      vlan 20
       name VoIP

  # === SERVICES ===
  - name: "FW-1"
    template: "asav"
    image: "asav-9.18.2"
    ethernet: 4
    ram: 4096
    cpu: 2
    left: 450
    top: 50
    startup_config: |
      hostname FW-1
      !
      interface GigabitEthernet0/0
       nameif outside
       ip address 10.0.0.100 255.255.255.0
       no shutdown
      !
      interface GigabitEthernet0/1
       nameif inside
       ip address 10.0.100.1 255.255.255.0
       no shutdown

# === LINKS ===
links:
  # Core interconnect
  - endpoints:
      - node: "Core-1"
        interface: 0
      - node: "Core-2"
        interface: 0

  # Core-1 to distribution
  - endpoints:
      - node: "Core-1"
        interface: 1
      - node: "Dist-1"
        interface: "Gi0/0"
  - endpoints:
      - node: "Core-1"
        interface: 2
      - node: "Dist-2"
        interface: "Gi0/0"

  # Core-2 to distribution
  - endpoints:
      - node: "Core-2"
        interface: 1
      - node: "Dist-1"
        interface: "Gi0/1"
  - endpoints:
      - node: "Core-2"
        interface: 2
      - node: "Dist-2"
        interface: "Gi0/1"

  # Dist-1 to access
  - endpoints:
      - node: "Dist-1"
        interface: "Gi0/2"
      - node: "Access-1"
        interface: "Gi0/0"
  - endpoints:
      - node: "Dist-1"
        interface: "Gi0/3"
      - node: "Access-2"
        interface: "Gi0/0"

  # Dist-2 to access
  - endpoints:
      - node: "Dist-2"
        interface: "Gi0/2"
      - node: "Access-3"
        interface: "Gi0/0"
  - endpoints:
      - node: "Dist-2"
        interface: "Gi0/3"
      - node: "Access-4"
        interface: "Gi0/0"
